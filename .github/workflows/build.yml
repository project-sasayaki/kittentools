
name: Build KittenTools

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install_Dependency
        shell: cmd
        run: scripts\install_dependency.bat
          
      - name: Verify Toolchain
        shell: cmd
        run: |
          echo "Checking Toolchain..."
          gcc --version
          git --version
          python --version
          make --version
          cmake --version

      - name: Build
        shell: cmd
        run: scripts\build.bat

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittenTools-Windows-x86
          path: win-release/
          if-no-files-found: error
