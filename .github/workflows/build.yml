
name: Build KittenTools

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Verify Toolchain
        shell: cmd
        run: |
          echo "Checking Toolchain..."
          git --version
          python --version
          
      - name: Install_Dependency
        shell: cmd
        run: scripts\install_dependency.bat

      - name: Install i686 libtre
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://mirror.jmu.edu/pub/msys2/mingw/mingw32/mingw-w64-i686-libtre-0.9.0-2-any.pkg.tar.zst" `
            -OutFile "C:\msys64\tmp-libtre.pkg.tar.zst"
          C:\msys64\usr\bin\bash.exe -lc "pacman -U --noconfirm /tmp-libtre.pkg.tar.zst"
          
      - name: Install i686 libsystre
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://mirror.jmu.edu/pub/msys2/mingw/mingw32/mingw-w64-i686-libsystre-1.0.2-3-any.pkg.tar.zst" `
            -OutFile "C:\msys64\tmp-libsystre.pkg.tar.zst"
          C:\msys64\usr\bin\bash.exe -lc "pacman -U --noconfirm /tmp-libsystre.pkg.tar.zst"
        
      - name: Install i686 Make
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://mirror.jmu.edu/pub/msys2/mingw/mingw32/mingw-w64-i686-make-4.4.1-5-any.pkg.tar.zst" `
            -OutFile "C:\msys64\tmp-make.pkg.tar.zst"
      
          C:\msys64\usr\bin\bash.exe -lc "pacman -U --noconfirm /tmp-make.pkg.tar.zst"
    
      - name: Verify Make
        shell: pwsh
        run: |
          make --version

      - name: Build
        shell: cmd
        run: scripts\build.bat

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittenTools-Windows-x86
          path: win-release/
          if-no-files-found: error
